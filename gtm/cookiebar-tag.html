<!--
  GTM Custom HTML tag: "CookieBar – Loader"
  Trigger: Consent Initialization – All Pages
  Tag firing priority: 100 (fires before the Termly tag in the same trigger)
  Consent settings: No additional consent required (it stores only the visitor's choice)

  Termly emits its "initialized" event (with the visitor's location) during its
  own startup, before any onload handler or polling can attach. So this tag
  watches for Termly to create window.Termly and add its .on() method, and
  attaches CookieBar's listeners at that exact moment. Then it loads cookiebar.js.
  Tested against the live Termly script on trlibrary.com, October 29, 2026.
-->
<script>
(function () {
  if (window.__trplCookieBarBoot) return;
  window.__trplCookieBarBoot = true;
  window.__trplCookieBarQueueing = true;
  window.TRPLCookieBar = window.TRPLCookieBar || { q: [] };

  function attach(T) {
    if (window.__trplCookieBarHooked || !T || typeof T.on !== 'function') return;
    window.__trplCookieBarHooked = true;
    T.on('initialized', function (d) { window.TRPLCookieBar.q.push(['initialized', d]); });
    T.on('consent', function (d) { window.TRPLCookieBar.q.push(['consent', d]); });
  }

  function watchObject(o) {
    if (!o || typeof o !== 'object') return;
    if (typeof o.on === 'function') { attach(o); return; }
    try {
      var onFn;
      Object.defineProperty(o, 'on', {
        configurable: true, enumerable: true,
        get: function () { return onFn; },
        set: function (f) { onFn = f; try { attach(o); } catch (e) {} }
      });
    } catch (e) {}
  }

  if (window.Termly) {
    watchObject(window.Termly);
  } else {
    try {
      var stored;
      Object.defineProperty(window, 'Termly', {
        configurable: true, enumerable: true,
        get: function () { return stored; },
        set: function (v) { stored = v; watchObject(v); }
      });
    } catch (e) {}
  }

  // Safety net in case Termly is defined some other way.
  var n = 0;
  var t = setInterval(function () {
    attach(window.Termly);
    if (window.__trplCookieBarHooked || ++n > 400) clearInterval(t);
  }, 25);

  var s = document.createElement('script');
  s.src = 'https://cookiebar.labs.trlibrary.com/cookiebar.js';
  s.async = true;
  document.head.appendChild(s);
})();
</script>
